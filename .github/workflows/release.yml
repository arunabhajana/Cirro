name: Release Cirro
on:
  push:
    tags: ['v*']
permissions:
  contents: write
concurrency:
  group: cirro-release
  cancel-in-progress: false
jobs:
  android-build:
    uses: ./.github/workflows/android-release.yml
    with:
      tag: ${{ github.ref_name }}
    secrets: inherit
  windows-release:
    needs: android-build
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      CIRRO_UPDATER_PUBLIC_KEY: ${{ secrets.CIRRO_UPDATER_PUBLIC_KEY }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require the tagged commit to be on main
        shell: pwsh
        run: |
          git merge-base --is-ancestor HEAD origin/main
          if ($LASTEXITCODE -ne 0) { throw 'Only tag commits already pushed to main.' }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Prevent replacing a published version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $existing = gh release view $env:GITHUB_REF_NAME --json isDraft 2>$null
          if ($LASTEXITCODE -eq 0 -and !(($existing | ConvertFrom-Json).isDraft)) { throw 'This version is already published. Use a new version tag.' }
          $global:LASTEXITCODE = 0
      - name: Prepare version and validate release configuration
        id: release
        run: node scripts/prepare-release.mjs
      - run: npm ci
      - name: Fetch pinned Flow engine if absent
        shell: pwsh
        run: |
          $manifest = Get-Content src-tauri/flow-engine/manifest.json | ConvertFrom-Json
          if (!(Test-Path src-tauri/flow-engine/rclone.exe)) {
            Invoke-WebRequest $manifest.source -OutFile "$env:RUNNER_TEMP/rclone.zip"
            if ((Get-FileHash "$env:RUNNER_TEMP/rclone.zip" -Algorithm SHA256).Hash.ToLower() -ne $manifest.archiveSha256) { throw 'Flow archive checksum mismatch' }
            Expand-Archive "$env:RUNNER_TEMP/rclone.zip" "$env:RUNNER_TEMP/cirro-rclone"
            $exe = Get-ChildItem "$env:RUNNER_TEMP/cirro-rclone" -Recurse -Filter rclone.exe | Select-Object -First 1
            Copy-Item $exe.FullName src-tauri/flow-engine/rclone.exe
          }
          if ((Get-FileHash src-tauri/flow-engine/rclone.exe -Algorithm SHA256).Hash.ToLower() -ne $manifest.executableSha256) { throw 'Flow executable checksum mismatch' }
      - name: Lint and type check once
        run: npm run lint
      - name: Frontend release tests once
        run: npm run test:release
      - name: Native tests once
        working-directory: src-tauri
        run: cargo test --locked
      - name: Build signed Windows installer and create draft release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Cirro ${{ github.ref_name }}
          releaseBody: ${{ steps.release.outputs.notes }}
          generateReleaseNotes: false
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          args: --bundles nsis
      - name: Fetch signed Android build
        uses: actions/download-artifact@v4
        with:
          name: Cirro-Android-${{ github.ref_name }}
          path: ${{ runner.temp }}/cirro-android
      - name: Verify release assets and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $apk = Join-Path $env:RUNNER_TEMP 'cirro-android/Cirro-android.apk'
          if (!(Test-Path -LiteralPath $apk)) { throw 'Missing signed Android APK. Release remains a draft.' }
          $draft = gh release view $env:GITHUB_REF_NAME --json isDraft | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or !$draft.isDraft) { throw 'Only draft releases may be assembled.' }
          gh release upload $env:GITHUB_REF_NAME $apk --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Android APK upload failed. Release remains a draft.' }
          $release = gh release view $env:GITHUB_REF_NAME --json assets | ConvertFrom-Json
          $names = $release.assets.name
          if (!($names -contains 'Cirro-android.apk') -or !($names -contains 'latest.json') -or !($names -match '\.exe$') -or !($names -match '\.sig$')) { throw 'Missing Android APK, Windows installer, update manifest or signature. Release remains a draft.' }
          # The Releases REST response does not expose an asset digest on every GitHub
          # plan/API version. Verify the actual release download instead, so publishing
          # is never coupled to that optional field.
          $verifyDirectory = Join-Path $env:RUNNER_TEMP 'cirro-android-verified'
          New-Item -ItemType Directory -Force -Path $verifyDirectory | Out-Null
          $publishedApk = Join-Path $verifyDirectory 'Cirro-android.apk'
          $downloaded = $false
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            if (Test-Path -LiteralPath $publishedApk) { Remove-Item -LiteralPath $publishedApk -Force }
            gh release download $env:GITHUB_REF_NAME --pattern 'Cirro-android.apk' --dir $verifyDirectory --clobber
            if ($LASTEXITCODE -eq 0 -and (Test-Path -LiteralPath $publishedApk)) {
              $downloaded = $true
              break
            }
            Start-Sleep -Seconds (2 * $attempt)
          }
          if (!$downloaded) { throw 'Android APK could not be downloaded from the draft release for verification. Release remains a draft.' }
          $expected = (Get-FileHash -LiteralPath $apk -Algorithm SHA256).Hash.ToLowerInvariant()
          $actual = (Get-FileHash -LiteralPath $publishedApk -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw 'Android APK hash verification failed. Release remains a draft.' }
          gh release edit $env:GITHUB_REF_NAME --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Publishing failed' }
