[package]
name = "cirro"
version = "1.1.0"
description = "A calmer home for Google Drive"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }
dotenvy = "0.15"

[dependencies]
tauri = { version = "2", features = ["image-png", "tray-icon"] }
openidconnect = "4"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "process", "io-util", "time", "sync", "macros"] }
open = "5"
sha2 = "0.10"
url = "2"
base64 = "0.22"
rusqlite = { version = "0.32", features = ["bundled"] }
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service"] }
tauri-plugin-updater = "2"

[target.'cfg(target_os = "windows")'.dependencies]
windows-future = "0.3"
windows = { version = "0.62", features = ["Security_Credentials_UI", "Networking_Connectivity", "UI_Notifications", "Data_Xml_Dom", "Storage_Provider", "Storage_Search", "Win32_System_WinRT"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_RemoteDesktop", "Win32_System_SystemInformation", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Registry", "Win32_System_Com", "Win32_System_IO", "Win32_System_CorrelationVector", "Win32_System_Threading", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_CloudFilters", "Win32_Storage_FileSystem", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging"] }

